<style>
/* Layout: left rail with 26 weeks grouped in 5 blocks, main column with a week and its 8 tabs. On phones the rail folds into a "Недели" menu. */
:root {
  --bg: #F7F5F0;
  --surface: #FFFFFF;
  --ink: #1B2233;
  --muted: #5A6173;
  --line: #E3DFD6;
  --accent: #2743D2;
  --accent-ink: #FFFFFF;
  --tint: #E9EDFC;
  --good: #1B6B43;
  --good-bg: #E3F3EA;
  --bad: #A8231B;
  --bad-bg: #FBE7E5;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-read: 'Source Serif 4', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141F; --surface: #191F2E; --ink: #EDEFF6; --muted: #A5ADC2; --line: #2B3346;
    --accent: #8FA6FF; --accent-ink: #10141F; --tint: #222C4D;
    --good: #6FD3A0; --good-bg: #12301F; --bad: #FF8F86; --bad-bg: #3A1815;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141F; --surface: #191F2E; --ink: #EDEFF6; --muted: #A5ADC2; --line: #2B3346;
  --accent: #8FA6FF; --accent-ink: #10141F; --tint: #222C4D;
  --good: #6FD3A0; --good-bg: #12301F; --bad: #FF8F86; --bad-bg: #3A1815;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.6 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 4.5vw, 2.5rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; margin-top: 1.6rem; }
p { margin: 0.6rem 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; text-decoration: none; color: var(--ink); }
.brand small { font-family: var(--f-body); font-weight: 400; color: var(--muted); font-size: 0.85rem; margin-left: 8px; }
.toplinks { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; cursor: pointer; text-decoration: none; color: var(--ink); display: inline-block; font-size: 0.95rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 2px 8px; font-size: 0.85rem; }
.link { background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0; margin-left: 8px; }

.app { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 36px; align-items: start; }
.rail { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; font-size: 0.93rem; }
.rail summary { display: none; }
.rail h4 { margin: 18px 0 4px; font-family: var(--f-display); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.rail h4:first-child { margin-top: 0; }
.rail a { display: grid; grid-template-columns: 26px 1fr 14px; gap: 6px; padding: 4px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; line-height: 1.35; }
.rail a:hover { background: var(--tint); }
.rail a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.rail .n { font-variant-numeric: tabular-nums; color: var(--muted); }
.rail a[aria-current="page"] .n { color: var(--accent-ink); }
.rail .soon { opacity: 0.62; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .rail { position: static; max-height: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; }
  .rail summary { display: block; cursor: pointer; font-weight: 600; }
  .rail[open] summary { margin-bottom: 8px; }
}

main { min-width: 0; }
.eyebrow { font-family: var(--f-display); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.lead { color: var(--muted); font-size: 1.05rem; max-width: 62ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin-top: 18px; }
.bar { height: 8px; background: var(--tint); border-radius: 4px; overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.big { font-family: var(--f-display); font-size: 2.6rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; margin-top: 22px; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 22px 0 18px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 10px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 0.95rem; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button em { font-style: normal; font-size: 0.72rem; letter-spacing: 0.06em; margin-left: 4px; color: var(--accent); }

.tblwrap { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--f-display); font-size: 0.82rem; color: var(--muted); font-weight: 500; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td b { color: var(--accent); }
.note { background: var(--tint); border-radius: 8px; padding: 10px 14px; margin: 14px 0; }
.note b:first-child { font-family: var(--f-display); }
.fr { font-family: var(--f-read); }
ul.tight { margin: 6px 0; padding-left: 20px; }
ul.tight li { margin: 3px 0; }

.read { font-family: var(--f-read); font-size: 1.1rem; line-height: 1.75; max-width: 66ch; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px 24px; }
.exset { margin-top: 22px; }
.exset > h3 { margin-top: 0; }
ol.ex { list-style: none; counter-reset: q; margin: 12px 0; padding: 0; display: grid; gap: 10px; }
ol.ex > li { counter-increment: q; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 12px 46px; position: relative; }
ol.ex > li::before { content: counter(q); position: absolute; left: 14px; top: 12px; font-family: var(--f-display); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
ol.ex > li.ok { border-color: var(--good); background: var(--good-bg); }
ol.ex > li.bad { border-color: var(--bad); background: var(--bad-bg); }
.q { font-family: var(--f-read); font-size: 1.05rem; }
.blank { font: inherit; font-family: var(--f-read); width: 11ch; min-width: 6ch; max-width: 100%; border: 0; border-bottom: 2px solid var(--accent); background: transparent; color: var(--ink); padding: 0 4px; margin: 0 2px; text-align: center; }
.gap { display: inline-block; width: 3ch; border-bottom: 2px solid var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.opt { position: relative; cursor: pointer; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt span { display: block; padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-family: var(--f-read); }
.opt input:checked + span { border-color: var(--accent); background: var(--tint); }
.opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.fb { font-size: 0.93rem; margin-top: 6px; min-height: 0; }
li.ok .fb { color: var(--good); }
li.bad .fb { color: var(--bad); }
.exfoot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sum { font-weight: 600; font-variant-numeric: tabular-nums; }
.vwrap td.ru { color: var(--ink); }
.vwrap.hide td.ru:not(.show) { color: transparent; background: var(--tint); cursor: pointer; user-select: none; }
.player { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
details.script { margin: 12px 0; }
details.script summary { cursor: pointer; color: var(--accent); }
details.script p { font-family: var(--f-read); }
textarea { width: 100%; min-height: 180px; font: inherit; font-family: var(--f-read); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; resize: vertical; }
input.txt { font: inherit; width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
.counter { font-variant-numeric: tabular-nums; color: var(--muted); }
.counter.good { color: var(--good); font-weight: 600; }
.check label { display: block; margin: 4px 0; }
.timer { font-family: var(--f-display); font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 34px; flex-wrap: wrap; }
.jform { display: grid; gap: 8px; grid-template-columns: 1fr 1fr auto; align-items: center; margin: 14px 0; }
@media (max-width: 640px) { .jform { grid-template-columns: 1fr; } }
.opt.tried span { text-decoration: line-through; opacity: 0.6; }
.opt input:disabled + span { cursor: default; }
li[data-locked] .opt { cursor: default; }
.why { margin-top: 8px; padding: 8px 12px; background: var(--tint); border-radius: 6px; color: var(--ink); }
.why p { margin: 4px 0; }
.mine { color: var(--muted); margin-top: 2px; }
.hwrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 6px 0; }
.hwrow input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--accent); }
.hwrow label { cursor: pointer; }
#hwReport { min-height: 220px; font-size: 0.93rem; }
.chip { font-size: 0.82rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); align-self: center; }
.chip.on { color: var(--good); background: var(--good-bg); border-color: transparent; }
.chip.off { color: var(--bad); background: var(--bad-bg); border-color: transparent; }
.students { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); margin-top: 18px; }
.stu { text-align: left; display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; min-width: 0; }
.stu:hover { border-color: var(--accent); }
.stu.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.sname { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
.dot.live { background: var(--good); }
.spanel { margin-top: 26px; }
.shead { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
.rename { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rename .txt { width: auto; min-width: 0; max-width: 200px; }
.wsel { display: flex; flex-wrap: wrap; gap: 6px; }
table.ans td { font-size: 0.9rem; }
tr.rbad td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
tr.rok td:first-child { box-shadow: inset 3px 0 0 var(--good); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
.pill.ok { color: var(--good); background: var(--good-bg); }
.pill.bad { color: var(--bad); background: var(--bad-bg); }
.tnum { font-variant-numeric: tabular-nums; white-space: nowrap; }
.hwlist { list-style: none; padding: 0; margin: 6px 0; }
.hwlist li { padding: 4px 0; color: var(--muted); }
.hwlist li.hdone { color: var(--ink); }
.fbcard { margin-top: 14px; border-color: var(--accent); }
label.eyebrow { display: block; margin-top: 10px; }
.ttsbox { display: grid; gap: 10px; }
.ttsbox p { margin: 0; }
select.txt { padding: 6px 8px; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width 0.3s; } }
/* ---------- Visual layer ---------- */
body { padding-block: 0 72px; }
h1 { font-size: clamp(1.8rem, 4.4vw, 2.7rem); letter-spacing: -0.02em; }
h2 { font-size: 1.45rem; letter-spacing: -0.01em; }
h3 { font-size: 1.12rem; }
svg.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }

.top { position: sticky; top: 0; z-index: 30; max-width: none; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 26px; padding: 10px max(16px, calc((100vw - 1240px) / 2)); background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: inline-flex; align-items: center; gap: 10px; font-size: 1.1rem; }
.brand .mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 0.95rem; letter-spacing: -0.03em; }
.brand small { margin-left: 0; }
.toplinks { align-items: center; }
.toplinks .btn { border-color: transparent; background: transparent; display: inline-flex; align-items: center; gap: 6px; }
.toplinks .btn:hover { background: var(--tint); border-color: transparent; }
.btn { border-radius: 9px; padding: 8px 14px; transition: background-color 0.15s, border-color 0.15s, transform 0.15s; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 3px 10px; border-radius: 7px; }
.btn.big-btn { padding: 12px 22px; font-size: 1.02rem; border-radius: 11px; }

.app { max-width: 1240px; grid-template-columns: 272px minmax(0, 1fr); gap: 34px; }
.rail { top: 80px; max-height: calc(100vh - 100px); padding-right: 6px; }
.rail h4 { display: flex; align-items: center; gap: 8px; margin: 20px 0 6px; letter-spacing: 0; text-transform: none; font-size: 0.86rem; color: var(--ink); }
.lvl { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--c, var(--accent)); color: #fff; font-family: var(--f-body); font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
.rail a { grid-template-columns: 26px 1fr 16px; align-items: center; padding: 6px 8px; border-radius: 9px; }
.rail .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--tint); font-size: 0.76rem; font-weight: 600; color: var(--ink); }
.rail a[aria-current="page"] .n { background: var(--accent-ink); color: var(--accent); }
.rail a > span:last-child { color: var(--good); font-weight: 700; }
.rail a[aria-current="page"] > span:last-child { color: var(--accent-ink); }

.card { border-radius: 14px; }
.lead { max-width: 66ch; }
.note { border-radius: 12px; border-left: 3px solid var(--accent); }
.tblwrap, .read { border-radius: 14px; }
th { background: var(--tint); color: var(--ink); }

/* Photo banners */
.hero { position: relative; overflow: hidden; border-radius: 20px; min-height: 320px; display: flex; align-items: flex-end; background: linear-gradient(135deg, #24366F, #5B3A8C); color: #fff; }
.hero.small { min-height: 210px; border-radius: 16px; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(10, 14, 30, 0.86) 0%, rgba(10, 14, 30, 0.5) 52%, rgba(10, 14, 30, 0.12) 100%); }
.hero-in { position: relative; z-index: 1; padding: 26px 28px; width: 100%; }
.hero h1 { color: #fff; }
.hero .eyebrow { color: rgba(255, 255, 255, 0.86); }
.hero .lead { color: rgba(255, 255, 255, 0.92); margin-bottom: 0; }
.hero .credit { position: absolute; z-index: 1; right: 12px; top: 10px; font-size: 0.72rem; color: rgba(255, 255, 255, 0.86); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7); }
.hero .credit a { color: inherit; }
.hero-row { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: space-between; margin-top: 18px; }
.hero .btn.primary { background: #fff; color: #18224A; border-color: #fff; }
.hero-prog { min-width: 210px; flex: 1; max-width: 340px; font-size: 0.92rem; }
.hero-prog .bar { background: rgba(255, 255, 255, 0.28); }
.hero-prog .bar i { background: #fff; }

/* Course map */
.blockhead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 34px; }
.blockhead h2 { margin: 0; }
.blockhead .counter { margin-left: auto; }
.weekgrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); margin-top: 14px; }
.wk { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; color: var(--ink); text-decoration: none; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; }
.wk:hover { border-color: var(--accent); }
.wk .pic { position: relative; aspect-ratio: 16 / 9; background: linear-gradient(135deg, var(--c, #24366F), #1B2233); }
.wk .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.wk .num { position: absolute; left: 10px; top: 10px; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 999px; background: rgba(10, 14, 30, 0.72); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 0.82rem; }
.wk .tick { position: absolute; right: 10px; top: 10px; width: 28px; height: 28px; border-radius: 50%; background: #1B6B43; color: #fff; display: grid; place-items: center; font-weight: 700; }
.wk .txt { padding: 12px 14px 14px; display: grid; gap: 4px; }
.wk b { font-family: var(--f-display); font-weight: 700; line-height: 1.25; }
.wk .counter { font-size: 0.86rem; line-height: 1.35; }
.wk.next { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.wk.next .num { background: var(--accent); color: var(--accent-ink); }

.howgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin-top: 14px; }
.how { display: grid; grid-template-columns: 38px 1fr; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.how .icbox, .next-ic { width: 38px; height: 38px; border-radius: 11px; background: var(--tint); color: var(--accent); display: grid; place-items: center; }
.how b { display: block; }
.how .counter { font-size: 0.88rem; line-height: 1.4; display: block; }
.foot { margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.88rem; color: var(--muted); }
.foot summary { cursor: pointer; color: var(--accent); }

/* Week tabs */
.tabs { gap: 6px; margin: 18px 0 20px; padding: 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.tabs button { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 10px; padding: 8px 12px; color: var(--ink); transition: background-color 0.15s; }
.tabs button:hover { background: var(--tint); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tabs button[aria-selected="true"] em { color: inherit; opacity: 0.85; }
.tabs button em { margin-left: 0; }
@media (min-width: 861px) { .tabs { position: sticky; top: 70px; z-index: 20; } }
@media (max-width: 860px) { .tabs { flex-wrap: nowrap; overflow-x: auto; } .tabs button { flex: none; } }
.tabnext { display: flex; align-items: center; gap: 14px; margin-top: 26px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.tabnext .grow { flex: 1; min-width: 0; }
.tabnext .counter { display: block; font-size: 0.85rem; }
.teacher-mode .tabnext { display: none; }

/* Exercises */
ol.ex > li { border-radius: 12px; padding: 14px 16px 14px 54px; }

    rules: [
      'Subjonctif нужен после необходимости и воли (il faut que, il est indispensable que), а также после союзов bien que, pour que, afin que, à condition que, jusqu’à ce que, à moins que (+ ne explétif): Il faut que tu puisses, bien qu’il pleuve.',
      'Indicatif ставится после уверенности и вероятности: je pense que, il est évident que, je suis sûr que, il est probable que + indicatif: Il est probable que la réforme sera votée.',
      'Гипотеза: si + présent → futur; si + imparfait → conditionnel présent; si + plus-que-parfait → conditionnel passé. После si никогда не ставится conditionnel: Si j’avais su, je serais venu.',
      'Относительные местоимения: dont заменяет дополнение с de (parler de, avoir besoin de); после других предлогов ставится lequel / laquelle / lesquels / auxquelles: la question à laquelle je réfléchis, les arguments sur lesquels il s’appuie.',
      'Связки: malgré + существительное, bien que + subjonctif, cependant / pourtant между двумя фразами; à cause de (негативная причина), grâce à (позитивная), d’où + существительное (следствие).',
      'Participe passé с être согласуется с подлежащим (elles sont parties); с avoir согласуется с прямым дополнением, если оно стоит перед глаголом (que, la, les): la lettre que j’ai reçue.',
      'Gérondif = en + participe présent (основа формы nous + -ant): en lisant, en faisant. Подлежащее у обоих действий одно и то же: On apprend en faisant des erreurs.',
      'Пассив: être в нужном времени + participe passé, согласованный с подлежащим; исполнитель вводится через par: Ces décisions ont été prises par le conseil.',
      'Официальное письмо: afin de + инфинитив при одном подлежащем (Je vous écris afin de…), формула завершения: Je vous prie d’agréer, Madame, Monsieur, l’expression de mes salutations distinguées.'
    ],

      'Гипотеза: si + imparfait → conditionnel présent; si + plus-que-parfait → conditionnel passé или présent (смешанная: Si j’avais préparé…, je serais moins stressé). Упрёк: tu aurais dû. Au cas où + conditionnel.',
      'Косвенная речь в прошедшем: présent → imparfait, passé composé → plus-que-parfait, futur → conditionnel. Вопрос без вопросительного слова вводится через si, qu’est-ce que → ce que.',
      'Порядок двойных местоимений: me / te / nous / vous → le / la / les → lui / leur → y → en (je te l’ai rendu, je les lui ai prêtés, je vais vous en donner). В утвердительном повелительном: donne-le-moi.',

];
function coDone(n) { var c = (S.scores[n + '-co'] || {}).co || {}; return CO_FIELDS.filter(function (f) { return (c[f[0]] || '').trim(); }).length; }
function authCoHTML(n) {

  var h = '<h2 style="margin-top:30px">🎧 Настоящий документ</h2><div class="card authco"><div class="eyebrow">TV5MONDE · ' + d[2] + ' · ' + esc(d[3]) + '</div><h3 class="fr" style="margin:6px 0">' + esc(d[1]) + '</h3>' +
    '<p class="counter">Настоящее французское видео, не озвучка: живая речь, темп, акценты — как на экзамене. Слушайте на сайте TV5MONDE, там же есть их упражнения с проверкой и расшифровка.</p>' +
    '<p><a class="btn primary" href="' + TV5 + d[0] + '" target="_blank" rel="noopener">▶ Открыть видео на TV5MONDE</a></p>' +
    '<p class="counter">Как на DELF: первое прослушивание — без субтитров, только понять общий смысл; второе — с пометками; субтитры и расшифровку — только в конце, для проверки. Видео доступно до ' + d[4] + '.</p></div>' +
    '<h3>Лист прослушивания</h3><p class="counter">Заполните после второго прослушивания. Ответы сохраняются, их видит преподаватель.</p><div class="cosheet" data-n="' + n + '">';
  CO_FIELDS.forEach(function (f) {
    if (n <= 4 && f[0] === 'avis') return;
    h += '<label class="eyebrow fr" for="co-' + f[0] + '">' + esc(f[1]) + '</label><p class="counter" style="margin:2px 0 4px">' + esc(f[2]) + '</p>' +
      (f[3] > 1 ? '<textarea id="co-' + f[0] + '" data-f="' + f[0] + '" lang="fr" style="min-height:' + (f[3] * 26 + 20) + 'px">' + esc(c[f[0]] || '') + '</textarea>' : '<input class="txt" id="co-' + f[0] + '" data-f="' + f[0] + '" lang="fr" value="' + esc(c[f[0]] || '') + '" style="max-width:100%;width:100%">');
  });

    '<p class="counter cosaved"></p></div>';

}
function bindAuthCo(p, n) {
  var box = $('.cosheet', p); if (!box) return;

    var c = {};
    $$('[data-f]', box).forEach(function (el) { c[el.dataset.f] = el.value.slice(0, 1500); });
    var r = $('input[name=colv]:checked', box); if (r) c.level = r.value;
    var filled = CO_FIELDS.filter(function (f) { return (c[f[0]] || '').trim(); }).length;
    S.scores[n + '-co'] = { best: filled, total: CO_FIELDS.length - (n <= 4 ? 1 : 0), co: c, t: Date.now() };
    save(); syncScore(n + '-co');

  };
  $$('[data-f], input[name=colv]', box).forEach(function (el) { el.addEventListener(el.type === 'radio' ? 'change' : 'input', function () { msg.textContent = 'Сохраняю…'; clearTimeout(tmr); tmr = setTimeout(store, 800); }); });
}
function coTeacherHTML(sc, n) {
  var e = sc && sc[n + '-co'], c = e && e.co; if (!c) return '';
  var d = AUTH_CO[n];
  return '<h3>Настоящий документ: лист прослушивания</h3><p class="counter">' + (d ? '<a href="' + TV5 + d[0] + '" target="_blank" rel="noopener">' + esc(d[1]) + '</a> · ' : '') + 'понял(а): <b>' + esc(c.level || '—') + '</b></p><div class="tblwrap"><table>' +
    CO_FIELDS.filter(function (f) { return (c[f[0]] || '').trim(); }).map(function (f) { return '<tr><td>' + esc(f[1]) + '</td><td class="fr">' + esc(c[f[0]]).replace(/\n/g, '<br>') + '</td></tr>'; }).join('') + '</table></div>';
}

/* ---------- Mock exam (#exam): runs the 4 DELF B2 parts of week 25 or 26 on a timer and scores them /100 ---------- */
var EXAM_PARTS = [
  { id: 'listening', code: 'CO', name: 'Compréhension de l’oral', ru: 'Аудирование', min: 30, keys: ['l', 'lv'], how: 'Прочитайте вопросы, прослушайте запись не больше двух раз, отвечайте сразу.' },
  { id: 'reading', code: 'CE', name: 'Compréhension des écrits', ru: 'Чтение', min: 60, keys: ['r', 'rv'], how: 'Сначала вопросы, потом текст. Без словаря.' },
  { id: 'writing', code: 'PE', name: 'Production écrite', ru: 'Письмо', min: 60, grid: 'gpe', how: '10 минут на план, 40 на текст, 10 на проверку. Минимум 250 слов. В конце оцените текст по сетке.' },
  { id: 'speaking', code: 'PO', name: 'Production orale', ru: 'Говорение', min: 50, grid: 'gpo', how: '30 минут подготовки, затем запишите на телефон монолог 5–7 минут и ответы на вопросы. В конце оцените себя по сетке.' }
];
var EXAM_WEEKS = [25, 26];
var examTimer = null;
function examPartScore(w, part) {
  if (part.grid) { var g = S.scores[w + '-' + part.grid]; return g && g.crit && Object.keys(g.crit).length === 5 ? g.best : null; }
  var ok = 0, tot = 0, any = false;
  part.keys.forEach(function (k) { var sc = S.scores[w + '-' + k]; if (sc) { any = true; ok += sc.best; tot += sc.total; } });
  return any && tot ? Math.round(ok / tot * 25 * 2) / 2 : null;
}
function examFmt(s) { s = Math.max(0, Math.round(s)); var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
function examStart(w, partId) {
  var part = EXAM_PARTS.filter(function (p) { return p.id === partId; })[0];
  S.exam = { w: w, part: partId, ends: Date.now() + part.min * 60000 }; save();
  activeTab[w] = partId;
  if (location.hash === '#week-' + w) route(); else location.hash = '#week-' + w;
  examBar();
}
function examFinish(timeUp) {
  var ex = S.exam; if (!ex) return;
  S.examDone = S.examDone || {}; (S.examDone[ex.w] = S.examDone[ex.w] || {})[ex.part] = Date.now();
  S.exam = null; save(); examBar();
  if (timeUp) alert('Время этой части вышло. Ответы сохранены.');
  location.hash = '#exam-' + ex.w;
}
function examBar() {
  var bar = $('#examBar');
  if (!S.exam) { if (bar) bar.remove(); if (examTimer) { clearInterval(examTimer); examTimer = null; } return; }
  var part = EXAM_PARTS.filter(function (p) { return p.id === S.exam.part; })[0];
  if (!bar) {
    document.body.insertAdjacentHTML('beforeend', '<div id="examBar" role="status"><span class="ebl"></span><b class="ebt tnum"></b><a class="btn small" id="ebGo">К заданию</a><button type="button" class="btn small primary" id="ebEnd">Закончить часть</button></div>');
    bar = $('#examBar');
    $('#ebEnd').addEventListener('click', function () { if (confirm('Закончить эту часть экзамена?')) examFinish(false); });
  }
  $('.ebl', bar).textContent = 'Пробный экзамен · ' + part.code + ' · ' + part.ru;
  $('#ebGo').setAttribute('href', '#week-' + S.exam.w);
  var tick = function () {
    if (!S.exam) return;
    var left = (S.exam.ends - Date.now()) / 1000;
    $('.ebt', bar).textContent = examFmt(left);
    bar.classList.toggle('late', left < 300);
    if (left <= 0) examFinish(true);
  };
  tick();
  if (!examTimer) examTimer = setInterval(tick, 1000);
}
function viewExam(w) {
  if (EXAM_WEEKS.indexOf(w) < 0) w = 0;
  var h = '<div class="eyebrow">DELF B2 · как на экзамене</div><h1>Пробный экзамен</h1>';
  if (!w) {
    h += '<p class="lead">Четыре части экзамена по таймеру, с итоговым баллом по правилам DELF: каждая часть оценивается из 25, всего 100. Диплом выдают при 50/100 и не меньше 5/25 в каждой части.</p><div class="weekgrid">';
    EXAM_WEEKS.forEach(function (n, i) {
      var done = EXAM_PARTS.filter(function (p) { return examPartScore(n, p) != null; }).length;
      h += '<a class="card" href="#exam-' + n + '" style="text-decoration:none"><div class="eyebrow">Вариант ' + (i + 1) + '</div><h3>Материалы недели ' + n + '</h3><p class="counter">Выполнено частей: ' + done + ' из 4</p></a>';
    });
    main.innerHTML = h + '</div><p class="counter">Совет: первый вариант проходите в неделю 25, второй — в неделю 26, и сравните баллы.</p>';
    return;
  }
  var total = 0, all = true, fail = false;
  h += '<p class="lead">Вариант ' + (EXAM_WEEKS.indexOf(w) + 1) + ' · материалы недели ' + w + '. Начинайте часть кнопкой: включится таймер, и откроется нужное задание. Таймер виден вверху страницы. Когда закончите, нажмите «Закончить часть».</p>';
  h += '<div class="tblwrap"><table><tr><th>Часть</th><th>Время</th><th>Что делать</th><th>Балл</th><th></th></tr>';
  EXAM_PARTS.forEach(function (p) {
    var sc = examPartScore(w, p), run = S.exam && S.exam.w === w && S.exam.part === p.id;
    if (sc == null) all = false; else { total += sc; if (sc < 5) fail = true; }
    h += '<tr><td><b>' + p.code + '</b> · ' + esc(p.ru) + '<br><span class="counter fr">' + esc(p.name) + '</span></td><td class="tnum">' + p.min + ' мин</td><td class="counter">' + esc(p.how) + '</td><td class="tnum"><b>' + (sc == null ? '—' : sc + ' / 25') + '</b></td><td>' +
      (run ? '<a class="btn small" href="#week-' + w + '">Идёт…</a>' : '<button type="button" class="btn small' + (sc == null ? ' primary' : '') + '" data-ex="' + p.id + '"' + (S.exam ? ' disabled' : '') + '>' + (sc == null ? 'Начать' : 'Пройти снова') + '</button>') + '</td></tr>';
  });
  h += '</table></div>';
  var verdict = !all ? 'Пройдите все четыре части, чтобы увидеть итог.' : fail ? 'Не сдано: в одной из частей меньше 5/25 — на экзамене это провал независимо от общего балла.' : total >= 50 ? 'Сдано: ' + total + '/100. ' + (total >= 75 ? 'Уверенный уровень B2.' : 'Запаса немного — поработайте над самой слабой частью.') : 'Не сдано: нужно минимум 50/100.';
  h += '<div class="card" style="margin-top:16px"><div class="eyebrow">Итог</div><h2 class="tnum">' + total + ' / 100</h2><p>' + verdict + '</p><p class="counter">CO и CE считаются автоматически по вашим ответам. PE и PO — по вашей оценке по официальной сетке; преподаватель видит её и сверит со своей.</p></div>' +
    '<p><a class="btn" href="#exam">← Все варианты</a></p>';
  main.innerHTML = h;
  $$('[data-ex]', main).forEach(function (b) { b.addEventListener('click', function () { examStart(w, b.dataset.ex); }); });
}

/* ---------- Self-test: checks all exercise data (open #selftest) ---------- */
function selfTest() {
  var probs = [], nSets = 0, nItems = 0;
  var isSet = function (v) { return Array.isArray(v) && v.length && v[0] && typeof v[0] === 'object' && 'q' in v[0]; };
  var add = function (w, name, i, msg, q) { probs.push({ w: w, s: name, i: i + 1, m: msg, q: String(q || '').slice(0, 90) }); };
  var checkSet = function (w, name, set) {
    nSets++;
    var seen = {};
    set.forEach(function (it, i) {
      nItems++;
      var q = it.q;
      if (typeof q !== 'string' || !q.trim()) { add(w, name, i, 'пустой вопрос', q); return; }
      var sig = q + '|' + (it.o || it.a || []).join('|');
      if (seen[sig]) add(w, name, i, 'повтор задания в наборе', q); seen[sig] = 1;
      if (/[A-Za-zÀ-ÿ]'[A-Za-zÀ-ÿ]/.test(q)) add(w, name, i, 'прямой апостроф вместо ’', q);
      if (it.a) {
        if (!it.a.length || it.a.some(function (x) { return typeof x !== 'string' || !x.trim(); })) add(w, name, i, 'пустой ответ', q);
        if ((q.match(/___/g) || []).length > 1) add(w, name, i, 'несколько пропусков в одном поле', q);
        it.a.forEach(function (x) { if (typeof x === 'string' && x !== x.trim()) add(w, name, i, 'пробел по краям ответа', q); if (/'/.test(x || '')) add(w, name, i, 'прямой апостроф в ответе', q); });
        if (it.w) { var all = norm(it.w.join(' ')); if (all.split(' ').sort().join(' ') !== norm(it.a[0]).replace(/[.,;:!?…«»"]/g, ' ').replace(/\s+/g, ' ').trim().split(' ').sort().join(' ')) add(w, name, i, 'слова-кнопки не совпадают с ответом', q); }
      } else if (it.o) {
        if (it.o.length < 2) add(w, name, i, 'меньше двух вариантов', q);
        var u = {}; it.o.forEach(function (x) { var k = norm(x); if (!k) add(w, name, i, 'пустой вариант', q); if (u[k]) add(w, name, i, 'одинаковые варианты', q); u[k] = 1; });
      } else add(w, name, i, 'нет ни ответа, ни вариантов', q);
    });
  };
  WEEKS.forEach(function (wk) {
    var c = wk.c, n = wk.n;
    var walk = function (obj, path) {
      Object.keys(obj || {}).forEach(function (k) {
        var v = obj[k];
        if (isSet(v)) checkSet(n, path + k, v);
        else if (Array.isArray(v) && v.length && isSet(v[0])) v.forEach(function (s, j) { if (isSet(s)) checkSet(n, path + k + '[' + (j + 1) + ']', s); });
        else if (typeof v === 'function' && /^(gA|gB|gC|vctx)$/.test(k)) { try { var r = v(); if (isSet(r)) checkSet(n, path + k, r); } catch (e) { add(n, path + k, -1, 'ошибка генератора: ' + e.message, ''); } }
        else if (v && typeof v === 'object' && !Array.isArray(v) && /^(more|reading|listening)$/.test(k)) walk(v, k + '.');
      });
    };
    walk(c, '');
    var parts = (c.grammar || '').split('</section>').length - 1, mo = c.more || {};
    if (mo.lx && mo.lx.length !== parts) add(n, 'more.lx', -1, 'наборов ' + mo.lx.length + ', правил ' + parts, '');
    if (mo.dz && mo.dz.length !== parts) add(n, 'more.dz', -1, 'наборов ' + mo.dz.length + ', уроков ' + parts, '');
  });
  window.__selftest = { sets: nSets, items: nItems, problems: probs };
  return window.__selftest;
}
function viewSelfTest() {
  var r = selfTest();
  var h = '<div class="eyebrow">Служебная страница</div><h1>Проверка заданий</h1><p class="lead tnum">Наборов: ' + r.sets + ' · заданий: ' + r.items + ' · проблем: ' + r.problems.length + '</p>';
  if (!r.problems.length) h += '<div class="card"><b>✓ Ошибок в данных не найдено.</b></div>';
  else {
    h += '<div class="tblwrap"><table><tr><th>Неделя</th><th>Набор</th><th>№</th><th>Проблема</th><th>Задание</th></tr>';
    r.problems.forEach(function (p) { h += '<tr><td>' + p.w + '</td><td>' + esc(p.s) + '</td><td>' + (p.i > 0 ? p.i : '') + '</td><td>' + esc(p.m) + '</td><td class="fr">' + esc(p.q) + '</td></tr>'; });
    h += '</table></div>';
  }
  main.innerHTML = h;
}

/* ---------- Router ---------- */
function route() {
  clearTimer(); stopSpeak();
  if (SH.needRole) { viewRole(); window.scrollTo(0, 0); return; }
  var h = (location.hash || '').replace(/^#/, '') || 'plan', m;
  if ((m = /^week-(\d+)$/.exec(h))) viewWeek(+m[1]);
  else if (h === 'reference') viewReference();
  else if (h === 'journal') viewJournal();
  else if (h === 'teacher') viewTeacher();
  else if (h === 'selftest') viewSelfTest();
  else if (h === 'review') viewReview();
  else if (h === 'exam') viewExam(0);
  else if ((m = /^exam-(\d+)$/.exec(h))) viewExam(+m[1]);
  else { h = 'plan'; viewPlan(); }
  examBar(); updReviewBadge();
  markRail(h);
  var mm = /^week-(\d+)$/.exec(h);
  syncLast(mm ? +mm[1] : 0, mm ? (activeTab[+mm[1]] || 'grammar') : '', mm ? 'week' : h);
  if (SH.on && h !== 'teacher' && !SH.name) { main.insertAdjacentHTML('afterbegin', nameCardHTML()); bindNameCard(); }
  if (SH.on && mm) shFetchFb();
  if (SH.teacher) shTeacherDecor();
  window.scrollTo(0, 0);
  if (mq.matches) $('#rail').open = false;
}
window.addEventListener('hashchange', route);
$('#themeBtn').addEventListener('click', function () {
  var cur = document.documentElement.getAttribute('data-theme');
  var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; save(); applyTheme();
});
buildRail();
route();
initSync();
initSheets();
})();
</script>
